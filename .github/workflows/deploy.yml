name: Build & Deploy
# Pipeline: git push -> build Docker image -> push to ghcr.io -> trigger Dokploy webhook -> redeploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}
env:
  IMAGE: ghcr.io/shurinbergo3/buildbyalex
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Авторизация в Docker Hub поднимает лимит на анонимный pull образа buildkit,
      # из-за которого падал setup-buildx (rate limit на общих IP GitHub Actions).
      # Шаг выполняется только если заданы секреты, иначе тихо пропускается.
      - name: Login to Docker Hub (avoid anonymous rate limit)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # build-push-action не умеет ретраить сам, а ghcr.io иногда отдаёт 503 при пуше слоёв.
      # Оборачиваем сборку в retry, чтобы транзиентные сбои реестра не валили деплой.
      - name: Build & push (with retry on registry 503)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            docker buildx build --push \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              -t ${{ env.IMAGE }}:latest \
              -t ${{ env.IMAGE }}:${{ github.sha }} \
              .
      # Вебхук Dokploy ставит редеплой в очередь при получении запроса, но держит
      # соединение открытым, пока идёт пересборка — из-за этого curl без --max-time
      # зависал на ~135с и падал по таймауту (код 28), роняя весь пайплайн, хотя
      # редеплой уже стартовал. Поэтому шлём fire-and-forget: ограничиваем время,
      # ретраим на транзиентных сбоях и не валим деплой из-за медленного ответа.
      - name: Trigger Dokploy redeploy
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --max-time 30 --retry 2 --retry-delay 5 --retry-connrefused \
            -X GET "${{ secrets.DOKPLOY_WEBHOOK }}") || true
          echo "Dokploy webhook status: ${code:-timeout}"
          case "${code:-timeout}" in
            2*|3*) echo "Redeploy triggered." ;;
            *) echo "::warning::Dokploy webhook did not return success (status=${code:-timeout}); the redeploy may still be running — verify in the Dokploy dashboard." ;;
          esac
      # After deploy, ping IndexNow (Bing/Yandex) for blog posts changed in this push.
      # Runs on the GitHub runner (full network egress), so no sandbox 403.
      # The script drops posts whose frontmatter date is still in the future —
      # those are 404 right now and get submitted by indexnow-daily.yml on their day.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Submit changed blog URLs to IndexNow
        if: ${{ github.event.before != '0000000000000000000000000000000000000000' }}
        continue-on-error: true
        run: node scripts/indexnow.mjs --since ${{ github.event.before }}
