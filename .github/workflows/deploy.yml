name: Build & Deploy
# Pipeline: git push -> build Docker image -> push to ghcr.io -> trigger Dokploy webhook -> redeploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}
env:
  IMAGE: ghcr.io/shurinbergo3/buildbyalex
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Авторизация в Docker Hub поднимает лимит на анонимный pull образа buildkit,
      # из-за которого падал setup-buildx (rate limit на общих IP GitHub Actions).
      # Шаг выполняется только если заданы секреты, иначе тихо пропускается.
      - name: Login to Docker Hub (avoid anonymous rate limit)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Dokploy redeploy
        run: curl -fsS -X GET "${{ secrets.DOKPLOY_WEBHOOK }}"
